[project]
name = "rota"
version = "0.1.0"
description = "Onde está Flávio Bolsonaro? — motor e compilador de conteúdo (build-time) do jogo"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
rota = "rota.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rota"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
packages = ["rota"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
